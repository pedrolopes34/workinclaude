name: Mosaico estadual de dNBR (Sentinel-2/GEE)

# Uma imagem do estado inteiro por mês, pro mapa de leitura de satélite do
# site (pipeline/run_dnbr_estado.py, docs/DECISIONS.md seção 6.55): WebP no
# R2 (dnbr-estado/AAAA-MM.webp) + linha em mosaicos_dnbr.
#
# - Mensal (dia 1): o mês que acabou de fechar.
# - Manual: um mês (`mes`) ou lote por ano (`anos`, JSON, ex.: [2018,2019]),
#   um job por ano. Meses que já têm mosaico são pulados, a não ser com
#   `forcar`.
# - Push na branch de desenvolvimento (só quando este arquivo ou o script
#   mudam): gera ago/2024, pra testar de ponta a ponta antes de mesclar.
#
# Secrets: DATABASE_URL, GEE_SERVICE_ACCOUNT_KEY e R2_* (os mesmos do
# process-sentinel-dnbr.yml; aqui o R2 é obrigatório).

on:
  schedule:
    - cron: "0 13 1 * *"
  push:
    branches: [claude/software-2-cqnuui]
    paths:
      - .github/workflows/dnbr-estado.yml
      - pipeline/run_dnbr_estado.py
  workflow_dispatch:
    inputs:
      mes:
        description: "Um mês só, AAAA-MM (ex.: 2024-08). Vazio = último mês completo."
        required: false
      anos:
        description: "Lote por ano, em JSON (ex.: [2018,2019,2020]) — gera os meses já fechados de cada ano. Ignora 'mes'."
        required: false
      forcar:
        description: "true = refaz meses que já têm mosaico"
        required: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  mes:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.anos == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Gerar mosaico
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL_BASE: ${{ secrets.R2_PUBLIC_URL_BASE }}
          EVENTO: ${{ github.event_name }}
          MES_INPUT: ${{ github.event.inputs.mes }}
          FORCAR_INPUT: ${{ github.event.inputs.forcar }}
        run: |
          ARGS=""
          if [ "$EVENTO" = "push" ]; then
            ARGS="--mes 2024-08 --forcar"
          elif [ -n "$MES_INPUT" ]; then
            ARGS="--mes $MES_INPUT"
          fi
          if [ "$FORCAR_INPUT" = "true" ] && [[ "$ARGS" != *--forcar* ]]; then
            ARGS="$ARGS --forcar"
          fi
          python -m pipeline.run_dnbr_estado $ARGS

  lote:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.anos != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        ano: ${{ fromJSON(github.event.inputs.anos || '[]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Gerar mosaicos de ${{ matrix.ano }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL_BASE: ${{ secrets.R2_PUBLIC_URL_BASE }}
          FORCAR_INPUT: ${{ github.event.inputs.forcar }}
        run: |
          python -m pipeline.run_dnbr_estado --ano ${{ matrix.ano }} $([ "$FORCAR_INPUT" = "true" ] && echo --forcar)
