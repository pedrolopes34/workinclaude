name: Investigar Vercel Analytics (temporário)

# Descartável (docs/DECISIONS.md seção 6.56): descobre de onde o
# @vercel/analytics 2.x carrega o script no site publicado — o caminho vem de
# NEXT_PUBLIC_VERCEL_OBSERVABILITY_BASEPATH, embutido no JS no build. Sai do
# repositório assim que a verificação diária aprender o caminho certo.

on:
  push:
    branches: [claude/software-2-cqnuui]
    paths:
      - .github/workflows/investigar-analytics.yml

jobs:
  investigar:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests
      - shell: python
        run: |
          import re, requests
          base = "https://workinclaude.vercel.app"
          html = requests.get(base, timeout=30).text
          srcs = sorted(set(re.findall(r'<script[^>]+src="([^"]+)"', html)))
          print(f"{len(srcs)} scripts na página inicial")
          candidatos = set()
          for src in srcs:
              url = src if src.startswith("http") else base + src
              js = requests.get(url, timeout=30).text
              achados = list(re.finditer(r"insights|OBSERVABILITY|vercel-scripts|/_vercel", js))
              if not achados:
                  continue
              print(f"\n== {src} ({len(js)} bytes, {len(achados)} ocorrências)")
              for m in achados[:8]:
                  trecho = js[max(0, m.start() - 160): m.end() + 160].replace("\n", " ")
                  print("  ...", trecho, "...")
                  candidatos.update(re.findall(r'"(/[A-Za-z0-9_\-./]{1,60})"', trecho))
          print("\ncandidatos a caminho:", sorted(candidatos))
          for c in sorted(candidatos) + ["/_vercel"]:
              for sufixo in ("/insights/script.js", "/script.js", ""):
                  r = requests.get(base + c.rstrip("/") + sufixo, timeout=30)
                  if sufixo == "" and r.status_code == 404:
                      continue
                  print(f"{c.rstrip('/') + sufixo} -> {r.status_code} {r.headers.get('content-type', '?')} {len(r.content)} bytes")
