name: Diagnóstico dos focos do INPE (por satélite)

# Ferramenta de operação, só leitura (docs/DECISIONS.md seção 6.51): conta os
# focos de um município/mês por satélite e roda o ST-DBSCAN com todos os
# satélites e só com o de referência, pra comparar com a pesquisa validada.
# Não usa secrets (o INPE é público e o nome do município vem do seed).
# O sandbox do Claude Code não alcança o INPE; este runner alcança.
#
# Dispara em push na branch de desenvolvimento (só quando este arquivo ou o
# script mudam) e aceita disparo manual depois de mesclado. Em push, roda
# o diagnóstico em aberto: a amostra com o arquivo anual de referência de SP
# (seção 6.55).

on:
  push:
    branches: [claude/software-2-cqnuui]
    paths:
      - .github/workflows/diagnostico-focos-inpe.yml
      - pipeline/diagnosticar_focos_inpe.py
  workflow_dispatch:
    inputs:
      municipio:
        description: "Código IBGE (padrão: 3539509, Pitangueiras)"
        required: false
      ano:
        description: "Ano (padrão: 2024)"
        required: false
      mes:
        description: "Mês 1-12 (padrão: 8)"
        required: false
      amostra:
        description: "true = compara os 63 da pesquisa (ago/2024, só satélite de referência) e conta o satélite de referência em 2025-2026 — ignora os campos acima"
        required: false
      listar_inpe:
        description: "true = lista as pastas do dataserver do INPE (onde ficam os arquivos anuais) — ignora os campos acima"
        required: false
      comparar_ref:
        description: "true = amostra de ago/2024 com o arquivo anual de referência de SP (o da pesquisa) — ignora os campos acima"
        required: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements-consulta.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements-consulta.txt

      - name: Contar focos por satélite
        env:
          MUNICIPIO_INPUT: ${{ github.event.inputs.municipio }}
          ANO_INPUT: ${{ github.event.inputs.ano }}
          MES_INPUT: ${{ github.event.inputs.mes }}
          AMOSTRA_INPUT: ${{ github.event.inputs.amostra }}
          LISTAR_INPUT: ${{ github.event.inputs.listar_inpe }}
          COMPARAR_REF_INPUT: ${{ github.event.inputs.comparar_ref }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$COMPARAR_REF_INPUT" = "true" ] || [ "$EVENTO" = "push" ]; then
            python -m pipeline.diagnosticar_focos_inpe --comparar-ref
          elif [ "$LISTAR_INPUT" = "true" ]; then
            python -m pipeline.diagnosticar_focos_inpe --listar-inpe
          elif [ "$AMOSTRA_INPUT" = "true" ]; then
            python -m pipeline.diagnosticar_focos_inpe --amostra
          else
            python -m pipeline.diagnosticar_focos_inpe \
              --municipio "${MUNICIPIO_INPUT:-3539509}" \
              --ano "${ANO_INPUT:-2024}" \
              --mes "${MES_INPUT:-8}"
          fi
