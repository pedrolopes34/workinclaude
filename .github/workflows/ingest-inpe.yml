name: Ingestão INPE + ST-DBSCAN

# Diário — "camada mais próxima de tempo real" do produto
# (docs/DECISIONS.md seção 1.1/2.5/6.13). Cada execução reprocessa o ano
# corrente inteiro (não um mês específico) e grava em metricas_anuais via
# UPSERT — idempotente, pode rodar de novo sem duplicar nada.
#
# ATENÇÃO — pendência não totalmente resolvida (docs/DECISIONS.md seção
# 6.12/6.18): a 1ª tentativa real desta sessão usava uma URL "anual" que
# deu 404; trocada por download mensal + concatenação
# (pipeline/ingest/inpe.py::URL_FOCOS_MENSAL_BR), com evidência real de
# arquivos indexados publicamente — mas ainda não confirmada rodando de
# verdade contra o servidor. Também pode não ser exatamente o produto que
# a pesquisa original usou (baixado manualmente pelo portal BDQueimadas).
# Reavaliar o resultado da próxima execução real antes de considerar
# resolvido.

on:
  schedule:
    # 09:17 UTC = 06:17 em São Paulo. Fora da hora cheia: é nela que o GitHub
    # mais atrasa ou descarta cron (docs/DECISIONS.md seção 6.56).
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano alvo pra reprocessar (ex.: 2025, pra rodar histórico) — vazio usa o ano corrente (padrão do cron diário)."
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      # Anos passados são imutáveis e ficam em cache entre execuções; o ano
      # corrente é sempre baixado de novo (--baixar-faltantes + forcar
      # interno em pipeline/run_ingest_stdbscan.py), então uma cache
      # "desatualizada" do ano corrente não é problema.
      - name: Cache dos CSVs anuais do INPE
        uses: actions/cache@v4
        with:
          path: focos_cache
          key: focos-inpe-${{ github.run_id }}
          restore-keys: |
            focos-inpe-

      - name: Rodar ingestão + ST-DBSCAN
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANO_INPUT: ${{ github.event.inputs.ano }}
        run: |
          if [ -n "$ANO_INPUT" ]; then
            python -m pipeline.run_ingest_stdbscan \
              --pasta-focos focos_cache \
              --baixar-faltantes \
              --ano "$ANO_INPUT"
          else
            python -m pipeline.run_ingest_stdbscan \
              --pasta-focos focos_cache \
              --baixar-faltantes
          fi
