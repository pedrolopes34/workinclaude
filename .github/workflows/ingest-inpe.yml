name: Ingestão INPE + ST-DBSCAN

# Diário — "camada mais próxima de tempo real" do produto
# (docs/DECISIONS.md seção 1.1/2.5/6.13). Cada execução reprocessa o ano
# corrente inteiro (não um mês específico) e grava em metricas_anuais via
# UPSERT — idempotente, pode rodar de novo sem duplicar nada.
#
# ATENÇÃO — pendência não resolvida (docs/DECISIONS.md seção 6.12): a URL
# de download abaixo (pipeline/ingest/inpe.py::URL_FOCOS_ANUAL_BR) é a
# única confirmada publicamente nesta sessão, mas pode não ser exatamente o
# produto que a pesquisa original usou (baixado manualmente pelo portal
# BDQueimadas). Este workflow só deve ser habilitado de verdade depois de
# resolver essa pendência — até lá, é esperado que a etapa de download
# falhe ou traga números que não batem com o validado academicamente.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 06:00 em São Paulo (horário de verão à parte)
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      # Anos passados são imutáveis e ficam em cache entre execuções; o ano
      # corrente é sempre baixado de novo (--baixar-faltantes + forcar
      # interno em pipeline/run_ingest_stdbscan.py), então uma cache
      # "desatualizada" do ano corrente não é problema.
      - name: Cache dos CSVs anuais do INPE
        uses: actions/cache@v4
        with:
          path: focos_cache
          key: focos-inpe-${{ github.run_id }}
          restore-keys: |
            focos-inpe-

      - name: Rodar ingestão + ST-DBSCAN
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m pipeline.run_ingest_stdbscan \
            --pasta-focos focos_cache \
            --baixar-faltantes
