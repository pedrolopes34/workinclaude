name: dNBR mensal (Sentinel-2/GEE)

# Mensal, todos os 645 municípios divididos em 2 jobs paralelos
# (docs/DECISIONS.md seção 2.1 — ~320 municípios/job, dentro do limite de
# 6h por job do GitHub Actions). Compara Sentinel-2 do mês anterior contra
# o mês corrente (docs/DECISIONS.md seção 6.14).
#
# Precisa dos secrets do repositório:
#   - DATABASE_URL: mesma string de conexão do ingest-inpe.yml (Neon)
#   - GEE_SERVICE_ACCOUNT_KEY: JSON completo da service account do Earth
#     Engine (nunca commitado — roteado só pra cá, ver docs/DECISIONS.md)
#   - R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / R2_BUCKET_NAME
#     / R2_PUBLIC_URL_BASE: Cloudflare R2, pra miniatura dNBR colorida
#     (docs/DECISIONS.md seção 6.40) — OPCIONAIS: sem eles, o job roda igual
#     e só não gera `dnbr_imagem_url` (degrada, nunca falha por causa disso)

on:
  schedule:
    - cron: "23 10 1 * *" # dia 1 de cada mês, 10:23 UTC (fora da hora cheia, seção 6.56)
  workflow_dispatch:
    inputs:
      municipio:
        description: "Código IBGE pra testar 1 município só (debug, minutos em vez de ~2h) — ex.: 3539509 (Pitangueiras). Liga os prints [DEBUG], útil pra validar a integração do R2 (docs/DECISIONS.md seção 6.40/6.41)."
        required: false

jobs:
  dnbr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grupo: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Rodar dNBR (grupo ${{ matrix.grupo }}/2)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL_BASE: ${{ secrets.R2_PUBLIC_URL_BASE }}
          MUNICIPIO_INPUT: ${{ github.event.inputs.municipio }}
        run: |
          if [ -n "$MUNICIPIO_INPUT" ]; then
            python -m pipeline.run_dnbr --municipio "$MUNICIPIO_INPUT"
          else
            python -m pipeline.run_dnbr --grupo ${{ matrix.grupo }} --de-grupos 2
          fi
