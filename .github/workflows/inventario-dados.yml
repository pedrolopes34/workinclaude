name: Inventário dos dados (só leitura)

# Ferramenta de operação (docs/DECISIONS.md seção 6.51): conta o que está de
# fato no banco de produção — linhas por ano, origem das linhas de 2024
# (seed da pesquisa ou pipeline), validações por fonte e consultas por
# status. Só lê. O sandbox do Claude Code não alcança o Neon; este runner
# alcança.
#
# Dispara em push na branch de desenvolvimento (só quando este arquivo ou o
# script mudam) e aceita disparo manual depois de mesclado.

on:
  push:
    branches: [claude/software-2-cqnuui]
    paths:
      - .github/workflows/inventario-dados.yml
      - pipeline/inventario_dados.py
  workflow_dispatch:

jobs:
  inventario:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements-consulta.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements-consulta.txt

      - name: Inventariar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.inventario_dados
