name: Testes do pipeline

on:
  push:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "pytest.ini"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements-dev.txt

      - name: Rodar testes
        run: pytest
