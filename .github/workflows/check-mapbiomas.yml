name: Validação MapBiomas Fogo (IoU + permutação)

# Só manual (docs/DECISIONS.md seção 6.50): o MapBiomas Fogo sai uma vez
# por ano, com defasagem (seção 1.1) — a Coleção 4 só vai até 2024 (seção
# 6.22). O cron mensal reprocessava o mesmo ano todo mês (~240 min de
# Actions sem produzir nada novo) e ajudou a esgotar a cota (seção 6.49).
# Disparar à mão quando sair coleção nova.
# Processa o último ano completo (--ano padrão = ano corrente - 1),
# dividido em 2 jobs (~2h no total pros 645, seção 6.35).
#
# Precisa dos secrets do repositório:
#   - DATABASE_URL, GEE_SERVICE_ACCOUNT_KEY (mesmos de ingest-inpe.yml e
#     process-sentinel-dnbr.yml)
#
# Pendência ainda aberta (seções 6.15/6.35): a mecânica do teste de
# permutação produz distribuição plausível, mas não foi conferida contra o
# notebook oficial da pesquisa.
#
# Histórico: o bug "sempre Baixa/IoU=0%/p=1.0" (seções 6.25/6.28) era de
# projeção e foi corrigido (seção 6.31). Antes disso, a rodada bugada
# sobrescreveu os 63 municípios validados manualmente (seção 6.29) — por
# isso validacao_mapbiomas tem a coluna `fonte` ('manual' nunca é
# sobrescrita pelo pipeline) e este workflow tem o input
# `restaurar_amostra_manual` pra reaplicar o seed oficial se preciso.

on:
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano a processar (padrão: ano corrente - 1)"
        required: false
      restaurar_amostra_manual:
        description: "true = só restaura os 63 municípios validados manualmente (fonte='manual') a partir do seed oficial e sai — não roda o pipeline normal. Usar se a amostra foi sobrescrita (docs/DECISIONS.md seção 6.29)."
        required: false
      municipio:
        description: "Código IBGE pra testar 1 município só (debug, minutos em vez de ~2h) — ex.: 3519600 (Ibitinga). Liga os prints [DEBUG] de geometria (docs/DECISIONS.md seção 6.28/6.30)."
        required: false

jobs:
  validacao:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grupo: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Cache dos CSVs anuais do INPE
        uses: actions/cache@v4
        with:
          path: focos_cache
          key: focos-inpe-${{ github.run_id }}
          restore-keys: |
            focos-inpe-

      - name: Rodar validação MapBiomas (grupo ${{ matrix.grupo }}/2)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          ANO_INPUT: ${{ github.event.inputs.ano }}
          RESTAURAR_AMOSTRA_MANUAL: ${{ github.event.inputs.restaurar_amostra_manual }}
          MUNICIPIO_INPUT: ${{ github.event.inputs.municipio }}
        run: |
          if [ "$RESTAURAR_AMOSTRA_MANUAL" = "true" ]; then
            python -m pipeline.run_validacao_mapbiomas --restaurar-amostra-manual
          elif [ -n "$MUNICIPIO_INPUT" ]; then
            python -m pipeline.run_validacao_mapbiomas \
              --pasta-focos focos_cache \
              --baixar-faltantes \
              --municipio "$MUNICIPIO_INPUT" \
              ${ANO_INPUT:+--ano "$ANO_INPUT"}
          else
            python -m pipeline.run_validacao_mapbiomas \
              --pasta-focos focos_cache \
              --baixar-faltantes \
              --grupo ${{ matrix.grupo }} --de-grupos 2 \
              ${ANO_INPUT:+--ano "$ANO_INPUT"}
          fi
