name: Validação MapBiomas Fogo (IoU + permutação)

# Mensal — não porque o MapBiomas Fogo atualiza todo mês (é anual, com
# defasagem, docs/DECISIONS.md seção 1.1), mas porque não há forma
# confirmada de checar antecipadamente se saiu coleção nova. UPSERT torna
# isso idempotente: se nada mudou, reprocessa à toa (custo aceito por ora).
# Processa o último ano completo (--ano padrão = ano corrente - 1),
# dividido em 2 jobs por precaução de desempenho — 999 permutações por
# município nunca foram medidas em escala nesta sessão.
#
# Precisa dos secrets do repositório:
#   - DATABASE_URL, GEE_SERVICE_ACCOUNT_KEY (mesmos de ingest-inpe.yml e
#     process-sentinel-dnbr.yml)
#
# ATENÇÃO — pendências não resolvidas (docs/DECISIONS.md seção 6.15/6.21):
# mecânica do teste de permutação é uma reconstrução não confirmada contra
# o notebook oficial, e o asset do MapBiomas Fogo no Earth Engine
# (pipeline/validacao/mapbiomas_gee.py) foi revisado com evidência mais
# forte (seção 6.21) mas ainda não confirmado contra a fonte primária, nem
# executado de verdade com sucesso. Não habilitar de verdade (cron) antes
# de confirmar — o workflow_dispatch manual é pra isso.
#
# Bug confirmado (seção 6.25/6.28): a rodada automática ainda devolve
# Baixa/IoU=0%/p=1.0 pra todo município. Ela já JÁ SOBRESCREVEU duas vezes
# os 63 municípios validados manualmente na pesquisa original (incidente
# real, seção 6.29) — por isso validacao_mapbiomas tem a coluna `fonte`
# ('manual' nunca é sobrescrita pelo pipeline) e este workflow tem o input
# `restaurar_amostra_manual` pra reaplicar o seed oficial se acontecer de
# novo.

on:
  schedule:
    - cron: "0 11 5 * *" # dia 5 de cada mes, 11:00 UTC (depois do dNBR do dia 1)
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano a processar (padrão: ano corrente - 1)"
        required: false
      restaurar_amostra_manual:
        description: "true = só restaura os 63 municípios validados manualmente (fonte='manual') a partir do seed oficial e sai — não roda o pipeline normal. Usar se a amostra foi sobrescrita (docs/DECISIONS.md seção 6.29)."
        required: false
      municipio:
        description: "Código IBGE pra testar 1 município só (debug, minutos em vez de ~2h) — ex.: 3519600 (Ibitinga). Liga os prints [DEBUG] de geometria (docs/DECISIONS.md seção 6.28/6.30)."
        required: false

jobs:
  validacao:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grupo: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Cache dos CSVs anuais do INPE
        uses: actions/cache@v4
        with:
          path: focos_cache
          key: focos-inpe-${{ github.run_id }}
          restore-keys: |
            focos-inpe-

      - name: Rodar validação MapBiomas (grupo ${{ matrix.grupo }}/2)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          ANO_INPUT: ${{ github.event.inputs.ano }}
          RESTAURAR_AMOSTRA_MANUAL: ${{ github.event.inputs.restaurar_amostra_manual }}
          MUNICIPIO_INPUT: ${{ github.event.inputs.municipio }}
        run: |
          if [ "$RESTAURAR_AMOSTRA_MANUAL" = "true" ]; then
            python -m pipeline.run_validacao_mapbiomas --restaurar-amostra-manual
          elif [ -n "$MUNICIPIO_INPUT" ]; then
            python -m pipeline.run_validacao_mapbiomas \
              --pasta-focos focos_cache \
              --baixar-faltantes \
              --municipio "$MUNICIPIO_INPUT" \
              ${ANO_INPUT:+--ano "$ANO_INPUT"}
          else
            python -m pipeline.run_validacao_mapbiomas \
              --pasta-focos focos_cache \
              --baixar-faltantes \
              --grupo ${{ matrix.grupo }} --de-grupos 2 \
              ${ANO_INPUT:+--ano "$ANO_INPUT"}
          fi
